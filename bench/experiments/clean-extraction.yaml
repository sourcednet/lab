# Clean extraction: the baseline, but reference lists, navigation boxes,
# hatnotes, and images are left out of what is signed (bench.WikipediaDrop).
# Expect fewer tokens per page and fewer chunks; see what it does to
# stability, storage, and ranking.
name: clean-extraction
corpus: bench/corpus/wikipedia-100
chunking: {min: 300, target: 1500, max: 4000}
extraction:
  drop: [".reflist", "ol.references", ".mw-references-wrap", "sup.reference", ".navbox", ".navbox-styles", ".hatnote", "figure", ".thumb", ".metadata", ".sistersitebox", ".noprint", ".mw-empty-elt"]
experiments: [stability, tokens, cost, passages, ranking]
ranking: {questions: bench/questions/wikipedia-100.yaml}

# Clean extraction with small chunks: the two best settings from the first
# full runs (Oct 1), together. Compare with clean-extraction and small-chunks.
# Since Phase 9, clean extraction also leaves out the link-list sections
# (See also, External links, …), as bench.WikipediaDropSections does.
name: clean-small
corpus: bench/corpus/wikipedia-100
chunking: {min: 150, target: 800, max: 2000}
extraction:
  drop: [".reflist", "ol.references", ".mw-references-wrap", "sup.reference", ".navbox", ".navbox-styles", ".hatnote", "figure", ".thumb", ".metadata", ".sistersitebox", ".noprint", ".mw-empty-elt"]
  drop_sections: ["See also", "External links", "Further reading", "References", "Bibliography"]
experiments: [stability, tokens, cost, passages, ranking]
ranking: {questions: bench/questions/wikipedia-100.yaml}

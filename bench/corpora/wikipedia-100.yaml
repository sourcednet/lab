# Corpus definition: 100 English Wikipedia articles, each with its latest
# 21 consecutive revisions (20 real edits). Fetched once with
# `sourced bench fetch`; the snapshot is frozen with a checksum.
#
# Topics are spread across fields and avoid living people. Wikipedia text is
# CC BY-SA 4.0: keep the fetched snapshot out of git, or attribute and
# share it under the same license.
